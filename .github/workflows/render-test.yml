name: Render test (первые 30 секунд, без звука)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Системные библиотеки для Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
      - run: npm install
      - run: |
          mkdir -p out
          npx remotion render src/index.ts Film out/test.mp4 --frames=0-899 --muted --codec=h264
      - uses: actions/upload-artifact@v4
        with:
          name: test-film
          path: out/test.mp4
