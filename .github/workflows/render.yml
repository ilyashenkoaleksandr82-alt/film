name: Render film (полный рендер)

on:
  workflow_dispatch:

jobs:
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: 1, frames: "0-5034"}
          - {part: 2, frames: "5035-10069"}
          - {part: 3, frames: "10070-15104"}
          - {part: 4, frames: "15105-20138"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Системные библиотеки для Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
      - run: npm install
      - name: Рендер части ${{ matrix.part }} (кадры ${{ matrix.frames }})
        run: |
          mkdir -p out
          npx remotion render src/index.ts Film out/part${{ matrix.part }}.mp4 \
            --frames=${{ matrix.frames }} --muted --codec=h264 --crf=16
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.part }}
          path: out/part${{ matrix.part }}.mp4

  final:
    needs: parts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Склейка частей, озвучка и LUT
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          for i in 1 2 3 4; do echo "file 'parts/part$i/part$i.mp4'" >> list.txt; done
          mkdir -p out
          ffmpeg -y -f concat -safe 0 -i list.txt -i public/audio/voiceover.mp3 \
            -filter_complex "[0:v]lut3d=public/grade/Doc_70s_Warm_Faded.cube[v];[1:a]apad[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -crf 16 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest \
            out/final_graded.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-film
          path: out/final_graded.mp4
